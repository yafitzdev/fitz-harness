<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fitz Codex Refinement</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #151615; color: #e8e8e3; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, select, textarea { font: inherit; color: inherit; }
      header { padding: 20px 24px 14px; border-bottom: 1px solid #303230; }
      h1 { margin: 0 0 4px; font-size: 21px; }
      header p { margin: 0; color: #999d96; }
      #progress { color: #72c99a; }
      .layout { min-height: calc(100vh - 90px); display: grid; grid-template-columns: 225px minmax(0, 1fr); }
      [role="tablist"] { padding: 12px 8px; overflow-y: auto; border-right: 1px solid #303230; background: #1a1d1c; }
      [role="tab"] { width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #a8aca5; text-align: left; cursor: pointer; }
      [role="tab"]:hover { background: #272a28; color: #eee; }
      [role="tab"][aria-selected="true"] { background: #303431; color: white; }
      main { padding: 28px clamp(22px, 5vw, 64px); }
      [role="tabpanel"] { max-width: 760px; }
      [role="tabpanel"][hidden] { display: none; }
      h2 { margin: 0 0 8px; font-size: 24px; }
      h3 { margin: 24px 0 8px; font-size: 14px; }
      .scope { color: #b9bcb6; }
      .availability { display: inline-block; margin: 8px 0 12px; padding: 4px 8px; border: 1px solid #424541; border-radius: 999px; font-size: 12px; }
      .availability.ready { color: #78d39f; }
      .availability.partial { color: #e4b66d; }
      .availability.missing { color: #ec8884; }
      .automated { margin: 8px 0 18px; padding: 10px 12px; border-left: 3px solid #59605b; background: #1d1f1e; color: #b9bcb6; }
      .automated.pass { border-color: #72c99a; }
      .automated.partial { border-color: #e4b66d; }
      ul { padding-left: 20px; }
      li { margin: 8px 0; }
      label.test { display: flex; gap: 8px; align-items: flex-start; }
      input[type="checkbox"] { margin-top: 4px; }
      .review { display: grid; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid #303230; }
      select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #3a3d39; border-radius: 7px; background: #202220; }
      textarea { min-height: 130px; resize: vertical; }
      .legend { display: grid; gap: 9px; padding: 14px; border: 1px solid #303230; border-radius: 8px; background: #1d1f1e; }
      .legend span { margin-right: 7px; }
      .overview-list { columns: 2; }
      .saved { min-height: 20px; color: #72c99a; font-size: 12px; }
      @media (max-width: 720px) { .layout { grid-template-columns: 150px 1fr; } main { padding: 22px 16px; } .overview-list { columns: 1; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Fitz Codex refinement</h1>
      <p>Test one small function at a time. <span id="progress">0 reviewed</span></p>
    </header>
    <div class="layout">
      <nav id="tabs" role="tablist" aria-label="Refinement sections"></nav>
      <main id="panels"></main>
    </div>
    <script>
      const sections = [
        { id: "overview", label: "Overview", availability: "ready", scope: "Use these tabs as the refinement sequence. Each tab covers one app function only.", tests: [] },
        { id: "sidebar", label: "Sidebar control", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Drag resize, persisted width after reload, mouse collapse/restore, and Ctrl+B paths passed.", "pass", "The duplicate in-chat restore control is removed, Codex branding is restored above New chat, task bubbles are gone, and project folders now use the exact Lucide Folder path extracted read-only from the installed Codex 26.721.4979 package.", "pass", "The Projects + action stays hidden until its heading is hovered or focused, and child chats now align directly with the project-name text column."], scope: "Resize, collapse, and restore the workspace sidebar.", tests: ["Drag the sidebar edge wider and narrower.", "Reload and confirm the width persists.", "Collapse and restore it with the single title-bar sidebar icon.", "Repeat collapse/restore with Ctrl+B."] },
        { id: "titlebar", label: "Window title bar", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Single integrated title bar rendered; File/Edit/View/Help menus now anchor directly below their buttons, and window controls remain accessible.", "pass", "The app-menu strip now uses Codex's extracted 36px compact-toolbar height instead of the previous 44px approximation."], scope: "Use one Codex-style title bar instead of stacked native title and menu rows.", tests: ["Compare its height and hierarchy with Codex.", "Open each application menu and check its anchor position.", "Use minimize and maximize.", "Confirm the workspace retains its rounded top-left corner."] },
        { id: "project-create", label: "Project creation", availability: "ready", automated: ["pass", "Validation, creation, selection, and success feedback passed."], scope: "Create a named project from the sidebar or empty state.", tests: ["Open the Create project dialog.", "Cancel without creating anything.", "Create a project with a useful name.", "Confirm it appears and becomes selected."] },
        { id: "project-source", label: "Project source folder", availability: "ready", automated: ["pass", "Codex-style project dialog and native folder chooser opened correctly; root-path persistence is covered by the API contract."], scope: "Associate a local source folder with a project when it is created.", tests: ["Open the source-folder chooser.", "Select a local workspace folder.", "Confirm the project name is inferred when blank.", "Confirm the root path is persisted."] },
        { id: "project-switch", label: "Project switching", availability: "ready", automated: ["pass", "Each project now preserves its own expanded/collapsed state; opening one no longer closes the others, and child rows animate from the project root."], scope: "Expand, collapse, and move between project trees independently.", tests: ["Expand two projects at the same time.", "Collapse one and confirm the other stays open.", "Watch the short open/close animation from the project root.", "Select chats across projects and confirm the header follows them."] },
        { id: "project-actions", label: "Project actions", availability: "ready", automated: ["pass", "The project-level new-chat action now remains visible while any child chat is hovered, matching Codex's separate project-header action. It uses Codex's 24px control geometry and square-pen icon; the overflow menu remains scoped to the root row and keeps the Codex action order."], scope: "Inspect and manage a project directly from its sidebar row.", tests: ["Hover a project and confirm the new-chat and three-dot controls appear.", "Move onto a child chat and confirm the project new-chat control remains visible.", "Use the new-chat control and confirm the composer is scoped to that project.", "Open the three-dot menu and compare its order and icons with Codex.", "Pin or unpin the project.", "Open Edit project and rename it.", "Remove only a disposable project and confirm its source folder remains untouched."] },
        { id: "task-create", label: "New chat", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "New chat and Ctrl+N open the Codex-style starter screen. Project, environment, and branch controls are interactive and aligned above the composer. Submitting the first prompt immediately replaces the starter screen with the conversation.", "pass", "The project/location/branch rail was reduced from 53px to 42px and now uses the extracted Codex Folder geometry."], scope: "Start a durable chat and configure its project, execution location, and branch directly above the composer.", tests: ["Click New chat or press Ctrl+N.", "Hover the project control and confirm its folder changes to the remove symbol.", "Open Local, select usage, and create a disposable worktree branch.", "Open the branch picker, search branches, switch branches, and create a disposable branch inline.", "Submit a first prompt and confirm the starter screen disappears immediately and a titled chat appears under the project."] },
        { id: "task-history", label: "Task history", availability: "ready", automated: ["pass", "Task switching and a full desktop restart both restored the transcript."], scope: "Select an existing task and restore its canonical transcript.", tests: ["Open a task with prior messages.", "Switch away and back.", "Restart the desktop and confirm the task remains."] },
        { id: "task-actions", label: "Chat actions", availability: "ready", automated: ["pass", "Per-row overflow and right-click menus opened; sidebar rename dialog and prior persisted rename passed. Archive remains intentionally unclicked during automation."], scope: "Manage any chat directly from its sidebar row.", tests: ["Open a chat overflow menu or right-click its row.", "Rename a chat that is not currently selected.", "Pin it or mark it unread.", "Copy its session ID or deeplink.", "Continue it in a new chat.", "Archive a disposable chat and confirm it leaves the active list."] },
        { id: "chat-hover", label: "Chat hover card", availability: "ready", automated: ["pass", "Hover/focus metadata card is wired with chat title, relative age, project, and branch."], scope: "Preview chat identity and workspace metadata without opening it.", tests: ["Hover a chat in an expanded project.", "Confirm title and relative age are shown.", "Confirm project and branch match.", "Move away and confirm the card closes."] },
        { id: "conversation", label: "Conversation view", availability: "ready", automatedAt: "2026-08-02", automated: ["partial", "Short and multiline messages passed. Long-scroll and failure cases remain.", "pass", "Assistant responses now render as clean unadorned text like Codex; the bordered sparkle badge beside every response was removed."], scope: "Render user, assistant, and failure messages clearly.", tests: ["Compare long and short user messages.", "Confirm assistant answers have no decorative badge.", "Inspect a multi-paragraph assistant response.", "Trigger or inspect an error message.", "Check scrolling in a long task."] },
        { id: "composer", label: "Composer input", availability: "ready", automated: ["pass", "Codex-style +, Full access, context ring, model/effort label, send layout, and multiline submission pass.", "pass", "Deep read-only extraction of installed Codex 26.721.4979.0 replaced the earlier guessed styling: 96% translucent #333 control surface, 16px backdrop blur, 25px multiline radius, exact light layered elevation, and extracted SquarePen/PanelLeft icon geometry. The sidebar remains the measured #1a2225."], scope: "Enter, edit, and submit a prompt from the floating composer.", tests: ["Confirm the lower toolbar mirrors the Codex structure.", "Confirm the project/location/branch rail ends above the composer instead of covering it.", "Attach with the + control.", "Type a multi-line prompt.", "Use Shift+Enter for a newline and Enter to submit.", "Check textarea growth and disabled states."] },
        { id: "run-stream", label: "Response streaming", availability: "ready", automated: ["pass", "Desktop chat now uses Pi's coding-agent loop by default instead of the raw completion fallback. A live Default-route run cold-loaded Qwen 3.6 27B, requested the bash tool, executed pwd in the selected project, returned the tool result to Pi, streamed the final answer, and persisted the complete turn."], scope: "Submit a Pi coding-agent run and display incremental assistant output.", tests: ["Submit a normal coding task with the engine unloaded.", "Confirm the recipe name and elapsed cold-start time update inside the conversation.", "Confirm tool execution status appears before incremental output.", "Send a second prompt and confirm the resident model responds without another cold start.", "Confirm the final transcript survives task switching."] },
        { id: "run-stop", label: "Run cancellation", availability: "ready", automated: ["pass", "Stop produced cancelled state, preserved partial output, and allowed a successful next prompt."], scope: "Stop an active generation without corrupting the task.", tests: ["Start a response long enough to cancel.", "Use the stop control.", "Confirm the status becomes cancelled.", "Send another prompt afterward."] },
        { id: "model-select", label: "Model selection", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The model menu is anchored directly above its composer control and flips nested menus away from the viewport edge.", "pass", "Effort is reduced to Light, Medium, and High. It controls the real max_tokens output budget sent to Pi at 2,048, 8,192, and 16,384 tokens; the redundant Speed row and higher tiers are removed.", "pass", "Advanced expands inline to a persisted 0.0–2.0 Temperature control and sends that value to Pi."], scope: "Choose an allowed stable route, output effort budget, and advanced sampling temperature for subsequent turns.", tests: ["Open the model settings popover and confirm it sits directly above the model control.", "Open the Model and Effort submenus and confirm they stay on-screen.", "Expand Advanced, move Temperature, close and reopen it, and confirm the value persists.", "Switch between available routes.", "Choose Light, Medium, and High and confirm the selected output budget is used.", "Check that the composer and Environment panel reflect the selection."] },
        { id: "playbooks", label: "Playbooks", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The app discovers arbitrary folders under C:\\Users\\yanfi\\llm\\engines, keeps registration in the Fitz database, leaves every repository untouched, and supports generic managed or external OpenAI-compatible engines.", "pass", "NiNfer, official llama.cpp, and vLLM now live as clean sibling repositories under C:\\Users\\yanfi\\llm\\engines.", "pass", "GGUF models are centralized under C:\\Users\\yanfi\\llm\\models\\gguf, while NiNfer artifacts live under C:\\Users\\yanfi\\llm\\models\\ninfer. These are the only canonical locations; Fitz creates no aliases in unrelated applications or legacy engine paths.", "pass", "Playbooks treats engine folders as automatic discovery: the redundant Add engine control and registry/runtime/path badges are removed, setup remains available per engine, and the route toggle uses borderless negative-space selected glyphs with a real Default donut.", "pass", "Every recipe row now has a compact far-right Test control. It sends “Say hi.” directly to that exact recipe through the normal serialized inference queue without changing Fast, Default, or Smart; the row reports Testing, ✓ Working, or Retry and keeps the bounded response or error in its tooltip.", "pass", "A successful recipe probe now gracefully ejects its model before ✓ Working appears. Recipe rows omit the redundant engine name and show the exact model ID plus context size as compact metadata pills.", "pass", "The canonical GGUF store already contained Gemma 4 26B A4B Q4_0 and Gemma 4 31B Q4_0 with matching multimodal projectors. Both are registered as 100k llama.cpp recipes without duplicating files or changing route assignments; Gemma thinking is disabled for clean OpenAI content, and the 26B recipe passed a real cold-load, response, and unload test."], scope: "Register engine repositories from one clean shared folder, then manage, directly test, and route their recipes.", tests: ["Create or clone an arbitrary repository directly beneath C:\\Users\\yanfi\\llm\\engines.", "Open Playbooks and refresh; confirm the folder appears with a Set up action.", "Configure it to start with Fitz or use an already-running OpenAI-compatible API.", "Confirm no Fitz manifest, sidecar, generated file, directory, or compatibility link appears outside C:\\Users\\yanfi\\llm.", "Add a recipe from that engine card, choosing a model beneath C:\\Users\\yanfi\\llm\\models.", "Confirm both Gemma recipes appear beneath llama.cpp with exact model labels and 100k context.", "Test an unassigned recipe and confirm its row becomes ✓ Working only after the engine returns to Unloaded, without changing any route.", "Trigger a failed recipe test and confirm Retry exposes the error in its tooltip.", "Move each route symbol and confirm the global assignment persists without an informational popup."] },
        { id: "engine-load", label: "Engine loading", availability: "ready", automated: ["pass", "The selected NiNfer 27B recipe completed a real 111-second cold start and returned the exact expected response. Static loading feedback was replaced with the model name and elapsed time, health probes remain bounded by the overall 180-second deadline, and the built-in NiNfer recipes now stay resident for 30 minutes instead of being evicted before their own cold-start cost is amortized."], scope: "Load the selected engine and model on demand with actionable status.", tests: ["Start with the engine unloaded.", "Submit the first prompt.", "Observe the model name and elapsed loading time until the first token arrives.", "Confirm a stalled health probe fails at the configured deadline with a useful redacted error."] },
        { id: "idle-eviction", label: "Idle eviction", availability: "partial", automated: ["partial", "Both NiNfer recipes now use a 30-minute idle TTL, and a warm request completed in 323ms after the cold load. The full 30-minute eviction boundary has not been observed manually yet."], scope: "Unload an idle model after its configured TTL without forcing a cold start between ordinary messages.", tests: ["Finish a generation.", "Observe the ready state during the 30-minute TTL.", "Wait for eviction.", "Confirm the next request reloads cleanly."] },
        { id: "queue", label: "Request queue", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Native Pi tasks now enter one host-level serial queue, so their complete tool/model loops cannot interleave. The Environment card shows running and queued requests with global positions, polls across clients, and can stop active work or remove waiting work. A multi-client integration test verifies ordering, queued cancellation, and automatic advancement; the full suite passes with 99 tests, typecheck, desktop build, packaged smoke, and a Fitz-only visual check."], scope: "Show queued work, ordering, and position while the single-generation engine is busy.", tests: ["Submit work from two clients.", "See both requests and their order in Environment → Requests.", "Cancel queued work from its × control.", "Confirm remaining work advances automatically."] },
        { id: "tool-activity", label: "Tool activity", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Pi activity renders inline with Codex-style negative-space SVGs: terminal rows for commands and reads, pencil rows for edits and writes, sparkle rows for generic tools, and a document/arrow row for context compaction.", "pass", "Every tool row is now an inline expandable disclosure with persisted raw input and result payloads, running/success/failure states, keyboard accessibility, bounded long-output rendering, and restoration after task switching.", "pass", "Collapsed command rows no longer show a permanent downward chevron: a right arrow appears only on hover or keyboard focus and rotates down while open. Bash expands into a Codex-style Shell card with the $ command, plain output, bounded scrolling, and a Success or Failed footer instead of generic Input/Result JSON."], scope: "Render agent commentary, commands, file operations, context maintenance, shell output, results, and failures inside the conversation.", tests: ["Run a task that comments before requesting a tool.", "Hover a collapsed command and confirm only a right arrow appears.", "Expand a bash command and compare its Shell card with Codex.", "Inspect the command, plain output, and terminal status.", "Confirm failed tools are visually distinct.", "Switch tasks and confirm the expandable input and result return from the transcript."] },
          { id: "tool-approval", label: "Tool approvals", availability: "ready", automated: ["pass", "Composer access control now offers Full access, Ask first, and Read only in a Codex-style inline menu. Pi's awaited pre-execution hook allows reads immediately, pauses commands and writes for a durable inline decision in Ask first, blocks changes in Read only, safely resumes approved work, and cancels pending approvals with the run.", "pass", "A real Pi SDK denial test requested a bash command that would create a file and verified the file was never created. The full suite passes with 97 tests, typecheck, build, desktop static packaging, and a Fitz-only visual check of the access menu."], scope: "Choose a tool-access policy and approve or deny gated execution inside the normal conversation layer.", tests: ["Open Full access below the composer and switch to Ask first.", "Trigger a bash command or file edit and inspect its exact arguments in the inline approval card.", "Approve it and confirm the same Pi run resumes and completes.", "Deny another and confirm the requested action never executes.", "Switch to Read only and confirm reads work while commands and edits are blocked."] },
        { id: "attachment", label: "File attachment", availability: "ready", automated: ["pass", "Small JSON attachment, task scoping, preview, and visible remove control passed. Authorized deletion is covered through storage and host API tests."], scope: "Attach or remove a bounded file from the current chat.", tests: ["Attach a small text or image file.", "Confirm its composer chip shows name, size, and × control.", "Remove a disposable attachment and confirm it disappears.", "Try an oversized file.", "Confirm files remain scoped to their chat."] },
        { id: "artifact-list", label: "Artifact list", availability: "ready", automated: ["partial", "The correct artifact name and byte size appeared. Multi-artifact comparison remains."], scope: "List artifacts belonging to the selected task.", tests: ["Open the Environment panel.", "Compare tasks with different artifacts.", "Check names and byte sizes.", "Select multiple artifacts in sequence."] },
        { id: "artifact-preview", label: "Artifact preview", availability: "ready", automated: ["partial", "Sandboxed text/code preview passed. Media, PDF, and unsupported types remain."], scope: "Safely preview text, code, image, audio, video, and PDF artifacts.", tests: ["Preview text or code.", "Preview an image.", "Try audio, video, or PDF if available.", "Confirm unsupported content fails safely."] },
        { id: "context-usage", label: "Context usage", availability: "ready", automated: ["pass", "Context ring click exposed estimated session usage, percentage, and recipe context limit; transcript changes update the meter."], scope: "Inspect how much of the active recipe context window the current chat uses.", tests: ["Click the context ring.", "Compare used tokens and context limit.", "Send another prompt and confirm usage increases.", "Switch chats and confirm usage changes."] },
        { id: "compaction", label: "Context compaction", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The context-ring popover now offers inline manual compaction. It creates a durable summary checkpoint, leaves every canonical transcript entry intact, feeds later Pi turns the checkpoint plus newer messages, and lowers the effective usage meter. Automatic threshold compaction remains active. API, checkpoint reuse, transcript preservation, multi-page retrieval, desktop wiring, and Fitz-only visual layout pass with the 103-test suite, typecheck, build, and smoke."], scope: "Compact oversized working context while preserving the canonical transcript.", tests: ["Build a session near its context budget.", "Open the context ring and choose Compact now.", "Confirm earlier transcript remains visible and a Context compacted row appears.", "Send another message and check continuity after the checkpoint."] },
        { id: "pairing", label: "Device pairing", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Administrators can now generate short-lived one-time pairing codes from the inline Administration workspace. Unauthorized desktops redeem them through the trusted Electron boundary, receive all enabled routes, and reconnect without exposing bearer credentials to renderer code. Issue, redeem, route visibility, replay rejection, secure storage, and actual authenticated/unauthenticated desktop states pass in the 105-test suite and Fitz-only visual QA."], scope: "Pair a new remote client with a one-time code through guided UI.", tests: ["Open Administration and issue a short-lived code.", "Redeem it from another Fitz desktop.", "Try reusing or expiring the code.", "Confirm the paired device appears under its user."] },
        { id: "device-auth", label: "Device authentication", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The desktop authenticates every host request with a revocable device credential encrypted by Electron safeStorage. Credentials are isolated per host origin, loaded after Windows secure storage is ready, never returned to renderer JavaScript, and invalid or revoked credentials return the app to the inline pairing page. Host auth/revocation integration plus desktop boundary checks pass in the 104-test suite."], scope: "Authenticate the desktop with a revocable device credential.", tests: ["Connect with a valid paired device.", "Try no token and an invalid token.", "Revoke the current device through the host API.", "Confirm the client returns to pairing on its next request."] },
        { id: "users", label: "User control", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The new inline Administration workspace creates users, changes roles, disables or restores accounts, lists active and revoked devices, protects the current administrator from accidental lockout, and shows the latest audited security activity. Host authorization and device lifecycle integration plus desktop wiring pass in the 105-test suite.", "pass", "Administration is visible again for the normal local auth-disabled host as well as authenticated administrator devices; it had incorrectly been hidden from local mode."], scope: "Create, disable, inspect, and role-assign users from an administrator screen.", tests: ["Create a consumer and an agent user.", "Change a role.", "Disable and re-enable a user.", "Inspect the recent activity list."] },
        { id: "permissions", label: "Permissions & quotas", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Each user now expands inline to Fast, Default, and Smart route grants plus bounded request, prompt, output, and queue quotas. Explicit allow, ask, or deny tool policies can target either a role or a user, with user policy precedence. Enforcement APIs, persistence, renderer wiring, typecheck, host smoke, packaged desktop smoke, and authenticated Fitz-only visual QA pass."], scope: "Manage route grants, tool policy, and request quotas per user or role.", tests: ["Grant and remove a route from an expanded user.", "Create a role or user tool decision.", "Set a small request quota and save access.", "Confirm the client explains enforcement."] },
        { id: "remote", label: "Remote connection", availability: "partial", automatedAt: "2026-08-02", automated: ["partial", "Administration now shows Tailscale state, device DNS/address, and private HTTPS Serve state with inline refresh plus staged enable/disable confirmation—no configuration dialogs. The host uses its actual listening port, keeps the service bound to loopback, audits changes, and the desktop already resumes active event streams with bounded exponential backoff. Mocked Serve/status API integration and desktop wiring pass in the 108-test suite; a real outside-LAN connection still needs manual verification."], scope: "Connect privately through Tailscale and recover from transient disconnects.", tests: ["Connect from outside the host LAN.", "Interrupt the connection during a run.", "Observe reconnect attempts.", "Resume from the last event sequence."] },
        { id: "environment", label: "Environment panel", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Floating rounded Environment card, route/connection state, artifact controls, and continued conversation layout passed.", "pass", "Environment no longer creates a third application column or stretches to the window height. It now lives inside the chat workspace itself as a 334px translucent Codex-style card, inset 14px from the conversation edges and below the chat header; it grows only to its content and scrolls at the workspace limit."], scope: "Inspect current engine, connection, route, and task artifacts without leaving the conversation.", tests: ["Open and close the floating card.", "Confirm the conversation continues underneath it without narrowing.", "Confirm the chat header and Environment toggle remain unobstructed.", "Check engine and route labels.", "Resize the window with it open.", "Confirm the card remains inset and scrolls rather than leaving the viewport."] },
        { id: "diagnostics", label: "Diagnostics", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Administration now includes live engine, queue, RAM, and VRAM cards; request and lifecycle metrics; recent failed, interrupted, or cancelled work; and a bounded JSON export. The host redacts secret-bearing keys before the bundle reaches the renderer. Host endpoint redaction tests, desktop bridge checks, typecheck, the 106-test suite, and smoke tests pass."], scope: "Show health, metrics, recent failures, and a redacted diagnostic export in the desktop.", tests: ["Open Administration and scroll to System diagnostics.", "Inspect resource and engine status.", "Export a diagnostic JSON bundle.", "Confirm secrets are absent."] },
        { id: "updates", label: "Desktop updates", availability: "partial", automatedAt: "2026-08-02", automated: ["partial", "Administration now shows persistent update state, available version, live download percentage, Check now, and Restart and install controls. The trusted Electron process owns checking and installation, preserves the latest status for newly loaded renderers, and explicitly explains development builds. Desktop bridge and event wiring pass in the 109-test suite; a signed published update still needs an end-to-end release test."], scope: "Check, download, and install signed desktop updates.", tests: ["Check when already current.", "Detect an available signed update.", "Observe download progress.", "Restart into the new version."] },
        { id: "host-startup", label: "Host startup", availability: "partial", automatedAt: "2026-08-02", automated: ["partial", "The packaged host now manages a per-user Windows sign-in entry that launches start-host.ps1 invisibly, with inline Administration status plus staged install/remove controls and an audit trail. Registry behavior is dependency-injected and tested without changing the workstation. A fresh 195 MB host package contains the launcher, and its packaged smoke test boots healthy with inference UNLOADED. A real Windows sign-out/sign-in cycle remains manual."], scope: "Start the lightweight host automatically while leaving models unloaded.", tests: ["Install startup from Administration, then restart Windows or sign in.", "Confirm the host becomes healthy.", "Confirm no model loads automatically.", "Open and close the desktop without stopping the host."] }
      ];

      const storageKey = "fitz-refinement-review-v1";
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch {}

      const tabs = document.getElementById("tabs");
      const panels = document.getElementById("panels");

      for (const section of sections) {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.id = `tab-${section.id}`;
        tab.role = "tab";
        tab.textContent = section.label;
        tab.setAttribute("aria-controls", `panel-${section.id}`);
        tab.addEventListener("click", () => activate(section.id));
        tabs.append(tab);

        const panel = document.createElement("section");
        panel.id = `panel-${section.id}`;
        panel.role = "tabpanel";
        panel.setAttribute("aria-labelledby", tab.id);
        const title = document.createElement("h2"); title.textContent = section.label;
        const badge = document.createElement("span"); badge.className = `availability ${section.availability}`; badge.textContent = availabilityText(section.availability);
        const scope = document.createElement("p"); scope.className = "scope"; scope.textContent = section.scope;
        panel.append(title, badge, scope);

        if (section.automated) {
          const automated = document.createElement("p"); automated.className = `automated ${section.automated[0]}`;
          automated.textContent = `Automated check · ${section.automatedAt || "2026-08-01"} · ${section.automated[1]}`;
          panel.append(automated);
        }

        if (section.id === "overview") renderOverview(panel);
        else renderReview(section, panel);
        panels.append(panel);
      }

      function renderOverview(panel) {
        const legend = document.createElement("div"); legend.className = "legend";
        legend.innerHTML = '<div><span class="availability ready">UI ready</span> Test it now.</div><div><span class="availability partial">Partial</span> Some backend or UI exists, but the flow is incomplete.</div><div><span class="availability missing">Missing</span> This refinement loop should design and build it.</div>';
        const heading = document.createElement("h3"); heading.textContent = "Suggested order";
        const list = document.createElement("ol"); list.className = "overview-list";
        for (const section of sections.slice(1)) { const item = document.createElement("li"); item.textContent = section.label; list.append(item); }
        panel.append(legend, heading, list);
      }

      function renderReview(section, panel) {
        const heading = document.createElement("h3"); heading.textContent = "Test checklist";
        const list = document.createElement("ul");
        section.tests.forEach((text, index) => {
          const item = document.createElement("li");
          const label = document.createElement("label"); label.className = "test";
          const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.checked = Boolean(saved[section.id]?.checks?.[index]);
          checkbox.addEventListener("change", () => { record(section.id).checks[index] = checkbox.checked; persist(); });
          const words = document.createElement("span"); words.textContent = text;
          label.append(checkbox, words); item.append(label); list.append(item);
        });
        const review = document.createElement("div"); review.className = "review";
        const verdictLabel = document.createElement("label"); verdictLabel.textContent = "Verdict";
        const verdict = document.createElement("select");
        for (const value of ["Untested", "Testing", "Pass", "Needs work", "Blocked"]) verdict.add(new Option(value, value));
        verdict.value = saved[section.id]?.verdict || "Untested";
        verdict.addEventListener("change", () => { record(section.id).verdict = verdict.value; persist(); });
        verdictLabel.append(verdict);
        const feedbackLabel = document.createElement("label"); feedbackLabel.textContent = "Feedback";
        const feedback = document.createElement("textarea"); feedback.placeholder = "What sucks? What did you expect instead?"; feedback.value = saved[section.id]?.feedback || "";
        const savedText = document.createElement("div"); savedText.className = "saved";
        feedback.addEventListener("input", () => { record(section.id).feedback = feedback.value; persist(); savedText.textContent = "Saved locally"; setTimeout(() => { savedText.textContent = ""; }, 900); });
        feedbackLabel.append(feedback);
        review.append(verdictLabel, feedbackLabel, savedText);
        panel.append(heading, list, review);
      }

      function availabilityText(value) { return value === "ready" ? "UI ready" : value === "partial" ? "Partial" : "Missing"; }
      function record(id) { saved[id] ||= { checks: [], verdict: "Untested", feedback: "" }; saved[id].checks ||= []; return saved[id]; }
      function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch {} updateProgress(); }
      function updateProgress() { const reviewed = sections.slice(1).filter(section => saved[section.id]?.verdict && saved[section.id].verdict !== "Untested").length; document.getElementById("progress").textContent = `${reviewed} of ${sections.length - 1} reviewed`; }
      function activate(id) {
        for (const tab of tabs.children) { const active = tab.id === `tab-${id}`; tab.setAttribute("aria-selected", String(active)); tab.tabIndex = active ? 0 : -1; }
        for (const panel of panels.children) panel.hidden = panel.id !== `panel-${id}`;
        history.replaceState(null, "", `#${id}`);
      }

      activate(sections.some(section => section.id === location.hash.slice(1)) ? location.hash.slice(1) : "overview");
      updateProgress();
    </script>
  </body>
</html>
