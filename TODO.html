<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <title>Fitz Codex Refinement</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #151615; color: #e8e8e3; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, select, textarea { font: inherit; color: inherit; }
      header { padding: 20px 24px 14px; border-bottom: 1px solid #303230; }
      h1 { margin: 0 0 4px; font-size: 21px; }
      header p { margin: 0; color: #999d96; }
      #progress { color: #72c99a; }
      .layout { min-height: calc(100vh - 90px); display: grid; grid-template-columns: 225px minmax(0, 1fr); }
      [role="tablist"] { padding: 12px 8px; overflow-y: auto; border-right: 1px solid #303230; background: #1a1d1c; }
      [role="tab"] { width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: #a8aca5; text-align: left; cursor: pointer; }
      [role="tab"]:hover { background: #272a28; color: #eee; }
      [role="tab"][aria-selected="true"] { background: #303431; color: white; }
      main { padding: 28px clamp(22px, 5vw, 64px); }
      [role="tabpanel"] { max-width: 760px; }
      [role="tabpanel"][hidden] { display: none; }
      h2 { margin: 0 0 8px; font-size: 24px; }
      h3 { margin: 24px 0 8px; font-size: 14px; }
      .scope { color: #b9bcb6; }
      .availability { display: inline-block; margin: 8px 0 12px; padding: 4px 8px; border: 1px solid #424541; border-radius: 999px; font-size: 12px; }
      .availability.ready { color: #78d39f; }
      .availability.partial { color: #e4b66d; }
      .availability.missing { color: #ec8884; }
      .automated { margin: 8px 0 18px; padding: 10px 12px; border-left: 3px solid #59605b; background: #1d1f1e; color: #b9bcb6; }
      .automated.pass { border-color: #72c99a; }
      .automated.partial { border-color: #e4b66d; }
      ul { padding-left: 20px; }
      li { margin: 8px 0; }
      label.test { display: flex; gap: 8px; align-items: flex-start; }
      input[type="checkbox"] { margin-top: 4px; }
      .review { display: grid; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid #303230; }
      select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #3a3d39; border-radius: 7px; background: #202220; }
      textarea { min-height: 130px; resize: vertical; }
      .legend { display: grid; gap: 9px; padding: 14px; border: 1px solid #303230; border-radius: 8px; background: #1d1f1e; }
      .legend span { margin-right: 7px; }
      .overview-list { columns: 2; }
      .saved { min-height: 20px; color: #72c99a; font-size: 12px; }
      @media (max-width: 720px) { .layout { grid-template-columns: 150px 1fr; } main { padding: 22px 16px; } .overview-list { columns: 1; } }
    </style>
  </head>

    <script>
      const sections = [
        { id: "audit-refactor", label: "Audit refactor", availability: "partial", automatedAt: "2026-08-09", automated: ["pass", "Shared recipe metadata, management navigation policy, adaptive workspace behavior, and compact overflow actions are now reusable components instead of renderer-specific copies.", "pass", "Consumers no longer see or deep-link into host-only Playbooks; Connections remains the user-facing routing contract.", "pass", "Media recipes no longer show meaningless text context badges, unconfigured engines do not leak raw folder names, and the composer consistently exposes Fast, Default, or Smart rather than a transient resolved model.", "pass", "Dead Inspector new-tab/fullscreen controls are removed, Context usage is named accurately, standalone chats are unambiguous, and downloaded-model maintenance lives behind a hover overflow menu.", "pass", "Compact windows automatically reclaim the project-sidebar width while the Inspector is docked and restore the user's sidebar afterward.", "pass", "750 tests passed with 1 intentional skip; typecheck, desktop static build, host build, and smoke passed.", "partial", "Production dependency audit still reports 4 high and 4 moderate transitive advisories in Pi/undici, Fastify/AJV/fast-uri, and electron-updater/js-yaml; dependency upgrades remain a separate hardening task."], scope: "Reduce brittle cross-feature UI code while preserving the polished current behavior.", tests: ["Sign in as a consumer and confirm host-only Playbooks are not exposed.", "Open every visible toolbar action and confirm none are inert or mislabeled.", "Inspect text and media recipes and confirm their metadata is modality-appropriate.", "Resize chat with the Inspector open and confirm the compact layout remains usable.", "Run the complete test, typecheck, build, smoke, and audit checks."] },
        { id: "overview", label: "Overview", availability: "ready", scope: "Use these tabs as the refinement sequence. Each tab covers one app function only.", tests: [] },
        { id: "ui-architecture", label: "UI components", availability: "ready", automatedAt: "2026-08-03", automated: ["pass", "The renderer now composes reusable ResizablePane, ConversationLayout, WorkspacePageController, CustomSelectController, ContextMenu, and shared popover primitives instead of owning duplicate pointer, keyboard, menu-positioning, and page-state code.", "pass", "Measured Codex tokens and scrollbar behavior live in imported theme/component styles, while the packaged build copies only the required CSS assets and bundles TypeScript components into the renderer.", "pass", "MessageActions now owns timestamps, hover copy, user edit, keyboard submission, and its component stylesheet. Shared DOM lookup, text-block, and SVG construction also live outside the feature renderer.", "pass", "ResourceInspector now owns file, URL, and artifact resolution; stale-request cancellation; rendered/source modes; syntax highlighting; sandboxed HTML; embedded scrollbars; media rendering; and external-open behavior.", "pass", "ActivityTimeline now owns commentary grouping, tool disclosures, Shell cards, approval decisions, compaction rows, resource search roots, live run status, and durable Worked for summaries across streaming and transcript restore.", "pass", "ProjectSidebarController now owns persistent project expansion, pin and unread state, project/session tree construction, quick actions, context menus, hover cards, and sidebar-specific styling. Happy DOM behavior tests cover independent expansion, callback routing, persisted unread state, and hover metadata.", "pass", "AgentRunController now owns submission, event replay cursors, reconnect backoff, queue state, incremental output, tool and approval events, engine polling, cancellation, and first-character model warmup. DOM behavior tests cover streaming, tools, approvals, warmup deduplication, and cancellation during run creation.", "pass", "ComposerControls now owns route and effort selection, Advanced temperature persistence, access mode, context usage and compaction state, nested popovers, labels, accessibility state, and component styling. Focused behavior tests cover selection callbacks, persistence, control gating, context rendering, and popover cleanup.", "pass", "PluginCatalogController now owns Plugins and Skills tabs, debounced search, pagination, installed/catalog rendering, website links, confirmation, install/update/enable/remove mutations, shared refresh, and component styling. Behavior tests cover catalog discovery, versioned installed-package matching, package actions, tab state, and skill filtering.", "pass", "ConnectionWorkspaceController now owns connection discovery, saved connection state, search, editor and authentication fields, testing and refresh, removal confirmation, hosted and remote model rows, fixed-route assignment, and the new-chat host chooser. Behavior tests cover synchronization failures, filtering, form submission, auth modes, route persistence, recipe tests, selection, and local fallback after removal."], scope: "Keep shell behavior modular so visual refinements do not create unrelated regressions.", tests: ["Resize both sidebars with mouse and keyboard and confirm persisted widths.", "Open native-looking selects, nested settings menus, and project/chat context menus near every viewport edge.", "Change route, effort, temperature, access mode, and context controls, then switch chats and confirm their labels and enabled state stay correct.", "Search and paginate Plugins, filter Skills, open a package website, and exercise install, update, enable, and remove actions.", "Add, edit, refresh, search, select, route, test, and remove Connections, then confirm new chats use the selected host and removal falls back to the local host.", "Switch among Playbooks, Connections, Plugins, Administration, and chat and confirm exactly one workspace is active.", "Hover, copy, edit, cancel, and resend user and assistant messages.", "Expand multiple projects independently, use project/chat quick actions and menus, mark a chat unread, and inspect both hover cards.", "Start a run, observe queue, tool, approval, streaming, and completion transitions, then stop another run while it is still starting.", "Resize the window and Inspector and confirm chat content, composer, scrollbar, and scroll-to-bottom remain on one responsive axis.", "Open files, URLs, attachments, Markdown, HTML source, and rendered HTML through the Inspector, then switch resources quickly and confirm stale previews never replace the latest one.", "Run a tool-using task, approve or deny a requested tool, expand its activity and Shell output, then switch tasks and confirm the Worked for summary restores from the transcript."] },
        { id: "sidebar", label: "Sidebar control", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Drag resize, persisted width after reload, mouse collapse/restore, and Ctrl+B paths passed.", "pass", "The duplicate in-chat restore control is removed, Codex branding is restored above New chat, task bubbles are gone, and every visible project location uses the same Codex folder glyph.", "pass", "Projects is bold, its + action stays hidden until the heading is hovered, and the obsolete Local host footer is removed."], scope: "Resize, collapse, and restore the workspace sidebar.", tests: ["Drag the sidebar edge wider and narrower.", "Reload and confirm the width persists.", "Collapse and restore it with the single title-bar sidebar icon.", "Repeat collapse/restore with Ctrl+B."] },
        { id: "titlebar", label: "Window title bar", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Single integrated title bar rendered; File/Edit/View/Help menus now anchor directly below their buttons, and window controls remain accessible.", "pass", "The app-menu strip is tightened to 32px with denser labels and the main workspace uses a subtler 12.5px top-left radius.", "pass", "Window dragging is scoped to the File/Edit/View/Help strip. The project/chat header is normal content and no longer moves the window."], scope: "Use the compact application-menu strip as the one window drag surface.", tests: ["Drag from empty space in the File/Edit/View/Help strip and confirm the window moves.", "Try dragging from the project/chat header and confirm it does not move.", "Open each application menu and check its anchor position.", "Use minimize and maximize."] },
        { id: "management-layout", label: "Management layout", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Playbooks, Connections, Plugins, and Administration now share the same 900px content axis, 44px top offset, responsive side padding, and permanently stable two-sided scrollbar gutter."], scope: "Keep every management tab perfectly aligned while switching between short and scrollable pages.", tests: ["Switch repeatedly among Playbooks, Connections, Plugins, and Administration.", "Confirm every page title and content edge stays on the same line.", "Compare a short page with a long scrollable page and confirm the scrollbar causes no horizontal jump."] },
        { id: "scrollbars", label: "Scrollbars", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Scrollable surfaces use a narrow transparent Codex-style rail with a rounded inset thumb, subtle idle contrast, and a clearer hover state."], scope: "Make scrolling visible without adding a heavy browser-looking strip to the interface.", tests: ["Scroll a long management page and the chat transcript.", "Confirm the thumb is narrow, rounded, and inset from the edge.", "Hover the thumb and confirm its contrast increases without changing width."] },
        { id: "project-create", label: "Project creation", availability: "ready", automated: ["pass", "Validation, creation, selection, and success feedback passed."], scope: "Create a named project from the sidebar or empty state.", tests: ["Open the Create project dialog.", "Cancel without creating anything.", "Create a project with a useful name.", "Confirm it appears and becomes selected."] },
        { id: "project-source", label: "Project source folder", availability: "ready", automated: ["pass", "Codex-style project dialog and native folder chooser opened correctly; root-path persistence is covered by the API contract."], scope: "Associate a local source folder with a project when it is created.", tests: ["Open the source-folder chooser.", "Select a local workspace folder.", "Confirm the project name is inferred when blank.", "Confirm the root path is persisted."] },
        { id: "project-switch", label: "Project switching", availability: "ready", automated: ["pass", "Each project now preserves its own expanded/collapsed state; opening one no longer closes the others, and child rows animate from the project root."], scope: "Expand, collapse, and move between project trees independently.", tests: ["Expand two projects at the same time.", "Collapse one and confirm the other stays open.", "Watch the short open/close animation from the project root.", "Select chats across projects and confirm the header follows them."] },
        { id: "project-actions", label: "Project actions", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The project new-chat and overflow controls appear only while the project root row itself is hovered or focused; hovering child chats no longer leaks the new-chat action."], scope: "Inspect and manage a project directly from its sidebar row.", tests: ["Hover a project and confirm the new-chat and three-dot controls appear.", "Move onto a child chat and confirm both project controls disappear.", "Use the new-chat control and confirm the composer is scoped to that project.", "Open the three-dot menu and compare its order and icons with Codex.", "Pin or unpin the project.", "Open Edit project and rename it.", "Remove only a disposable project and confirm its source folder remains untouched."] },
        { id: "task-create", label: "New chat", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "New chat and Ctrl+N open the Codex-style starter screen. Project, environment, and branch controls are interactive and aligned above the composer. Submitting the first prompt immediately replaces the starter screen with the conversation.", "pass", "The project/location/branch rail was reduced from 53px to 42px and now uses the extracted Codex Folder geometry."], scope: "Start a durable chat and configure its project, execution location, and branch directly above the composer.", tests: ["Click New chat or press Ctrl+N.", "Hover the project control and confirm its folder changes to the remove symbol.", "Open Local, select usage, and create a disposable worktree branch.", "Open the branch picker, search branches, switch branches, and create a disposable branch inline.", "Submit a first prompt and confirm the starter screen disappears immediately and a titled chat appears under the project."] },
        { id: "task-history", label: "Task history", availability: "ready", automated: ["pass", "Task switching and a full desktop restart both restored the transcript."], scope: "Select an existing task and restore its canonical transcript.", tests: ["Open a task with prior messages.", "Switch away and back.", "Restart the desktop and confirm the task remains."] },
        { id: "task-actions", label: "Chat actions", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Per-row overflow and right-click menus opened; sidebar rename dialog and prior persisted rename passed. Archive remains intentionally unclicked during automation.", "pass", "Chat and project overflow menus now share the Codex floating-menu surface, with consistent icon gutters, rounded hover rows, separators, and red destructive actions.", "pass", "Sidebar overflow menus were narrowed from 274px to 242px and use compact 32px rows; the live chat menu passed Fitz-only visual QA."], scope: "Manage any chat directly from its sidebar row.", tests: ["Open a chat overflow menu or right-click its row.", "Rename a chat that is not currently selected.", "Pin it or mark it unread.", "Copy its session ID or deeplink.", "Continue it in a new chat.", "Archive a disposable chat and confirm it leaves the active list."] },
        { id: "chat-hover", label: "Chat hover card", availability: "ready", automated: ["pass", "Hover/focus metadata card is wired with chat title, relative age, project, and branch."], scope: "Preview chat identity and workspace metadata without opening it.", tests: ["Hover a chat in an expanded project.", "Confirm title and relative age are shown.", "Confirm project and branch match.", "Move away and confirm the card closes."] },
        { id: "conversation", label: "Conversation view", availability: "ready", automatedAt: "2026-08-03", automated: ["partial", "Short and multiline messages passed. Long-scroll and failure cases remain.", "pass", "Assistant responses now render without a decorative badge, matching Codex's unadorned answer layout.", "pass", "Assistant and commentary output now renders sanitized Markdown during streaming and transcript restore: headings, paragraphs, emphasis, lists, task lists, quotes, safe links, tables, inline code, and copyable fenced code blocks. User prompts and system failures remain plain text.", "pass", "Live Pi commentary and tool activity is visible during a run, then collapses behind a durable Worked for Xm Ys disclosure as soon as final output begins. The disclosure restores the complete activity feed, while compaction now remains a single icon-and-text row.", "pass", "Hovering any user, assistant, or commentary message reveals compact Codex-style actions with the weekday/time label. Assistant and commentary Copy sits on the left and is lowered slightly; user Copy and Edit sit on the right. User Edit becomes an inline textarea with Cancel and Send inside the same bubble beneath the text.", "pass", "The transcript scroll viewport spans the entire chat pane up to the Inspector boundary, keeping its scrollbar at that edge. Direct transcript children occupy a dedicated inner grid track that consumes the exact same gutter and width variables as the composer.", "pass", "A live agent run now retains one work-summary container across every commentary, tool, approval, and assistant transition. It collapses to exactly one Worked for disclosure only when the run completes, fails, is cancelled, or is interrupted.", "pass", "Reasoning/commentary messages no longer create timestamp or Copy controls, including when a live assistant message is reclassified after a tool begins. Removing the hidden 24px action row and reducing commentary/activity margins makes expanded work feeds follow visible content with no phantom blank lines."], scope: "Render user, assistant, and failure messages clearly.", tests: ["Resize the window wider and narrower; confirm the transcript and composer share both horizontal edges at every size.", "Open and resize the Inspector; confirm the transcript scrollbar stays on the Inspector boundary while content remains aligned to the composer.", "Scroll to the final message and confirm no transcript text appears below the composer.", "Hover a user, assistant, and commentary message; confirm the weekday/time and Copy appear only while hovered or focused.", "Confirm assistant and commentary Copy is left aligned; user actions are right aligned.", "Copy assistant Markdown and confirm the rendered message text is placed on the clipboard.", "Hover a user message and confirm the Edit pencil appears.", "Use Edit and confirm the same bubble becomes an editable field with Cancel and Send inside the bubble below the edited text.", "Cancel and confirm the original message returns unchanged.", "Send a revision and confirm it becomes the next agent turn.", "Run a long tool-using prompt with several commentary and tool transitions and confirm the completed turn creates exactly one Worked for disclosure.", "Open that disclosure and confirm commentary plus commands are restored.", "Confirm Context compacted remains on one line.", "Trigger or inspect an error message.", "Check scrolling in a long task.", "Expand a completed tool-heavy task and hover its reasoning paragraphs; confirm no timestamp or Copy controls appear and no hidden action-row gaps remain."] },
        { id: "resource-links", label: "Chat file links", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Assistant Markdown now turns explicit links, plain web URLs, Windows paths, repository-relative paths, source locations, and file-like inline code into Inspector links. Read, edit, and write tool rows link their target files too.", "pass", "Bare filenames are resolved against project paths plus directories disclosed by prior agent file/list operations. Missing files now show a concise Inspector message instead of Electron IPC internals."], scope: "Open files and URLs directly from the conversation without leaving the task.", tests: ["Ask Fitz to mention README.md, apps/desktop/src/renderer.ts:1, and a web URL.", "Confirm every reference is visibly clickable.", "Click each reference and confirm the Inspector replaces its content in place.", "Run a read tool and click its completed activity row."] },
        { id: "inspector-text", label: "Text & code inspector", availability: "ready", automatedAt: "2026-08-03", automated: ["pass", "The old Environment surface is rebuilt as a dedicated 400px Inspector. A trusted Electron bridge keeps relative references inside the active project, accepts explicit absolute paths emitted by agent tools, rejects binary or oversized files, and renders selectable text/code with source-line positioning.", "pass", "Inspector and conversation geometry is measured once in workspace pixels and written back as immutable viewport, content-width, and gutter values. This prevents inherited CSS percentages from resolving against the narrower chat scroller and subtracting the Inspector twice.", "pass", "Source previews use Highlight.js with extension-based language selection and a Fitz dark syntax palette for HTML/XML, CSS, JavaScript, TypeScript, JSON, Markdown, shell, Python, C/C++, C#, Go, Java, Rust, SQL, and YAML.", "pass", "Rendered local HTML receives a final high-specificity Fitz scrollbar override inside its sandbox document, including its root scrolling element."], scope: "Inspect referenced text and source files safely in a real right sidebar.", tests: ["Click a text file and a source file from chat.", "Drag the Inspector's left edge wider and narrower, then reload and confirm the width persists.", "Confirm chat content retains a readable responsive measure instead of collapsing.", "Confirm the Inspector and rendered HTML use the same compact dark scrollbar as chat.", "Toggle an HTML file to source and confirm tags, attributes, strings, CSS, and values are colored.", "Open a path with :line or #Lline and confirm the preview scrolls near it.", "Close the Inspector and confirm the conversation expands again."] },
        { id: "inspector-markdown", label: "Markdown inspector", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "Markdown files use the same safe DOM renderer as assistant messages, including headings, lists, tables, links, and fenced code. A header control switches between rendered output and source."], scope: "Read Markdown as a document or inspect its source without another application.", tests: ["Open README.md from a chat link.", "Check headings, lists, links, tables, and code blocks.", "Toggle View source and back to rendered output.", "Click another file reference inside the Markdown preview."] },
        { id: "inspector-html", label: "HTML inspector", availability: "ready", automatedAt: "2026-08-03", automated: ["pass", "Local HTML renders in a sandboxed iframe with scripts disabled. A header control switches between the rendered document and selectable HTML source.", "pass", "The iframe viewport uses the Inspector's dark background and color scheme. Fitz applies its compact transparent-track scrollbar both in source markup and directly after the sandbox document loads, so the embedded root scroller cannot fall back to a white native strip."], scope: "Render local HTML safely inside the Inspector.", tests: ["Ask Fitz for a link to TODO.html and open it.", "Confirm the page renders in the right sidebar with the same dark compact scrollbar as chat.", "Toggle to source and back.", "Confirm scripts in a disposable HTML file cannot run or reach the Fitz renderer."] },
        { id: "inspector-web", label: "Web inspector", availability: "partial", automatedAt: "2026-08-02", automated: ["partial", "HTTP and HTTPS links open in an isolated Inspector frame with no referrer and an explicit Open outside Fitz action. Sites that prohibit embedding still require the outside-browser fallback."], scope: "Inspect embeddable web URLs alongside a chat while retaining a deliberate external-browser escape hatch.", tests: ["Open an embeddable URL from assistant output.", "Confirm navigation remains inside the Inspector.", "Use Open outside Fitz.", "Try a site that blocks embedding and confirm the external action remains available."] },
        { id: "composer", label: "Composer input", availability: "ready", automated: ["pass", "Codex-style +, Full access, context ring, model/effort label, send layout, and multiline submission pass.", "pass", "Deep read-only extraction of installed Codex 26.721.4979.0 replaced the earlier guessed styling: 96% translucent #333 control surface, 16px backdrop blur, 25px multiline radius, exact light layered elevation, and extracted SquarePen/PanelLeft icon geometry. The sidebar remains the measured #1a2225."], scope: "Enter, edit, and submit a prompt from the floating composer.", tests: ["Confirm the lower toolbar mirrors the Codex structure.", "Confirm the project/location/branch rail ends above the composer instead of covering it.", "Attach with the + control.", "Type a multi-line prompt.", "Use Shift+Enter for a newline and Enter to submit.", "Check textarea growth and disabled states."] },
        { id: "run-stream", label: "Response streaming", availability: "ready", automatedAt: "2026-08-03", automated: ["pass", "Desktop chat now uses Pi's coding-agent loop by default instead of the raw completion fallback. A live Default-route run cold-loaded Qwen 3.6 27B, requested the bash tool, executed pwd in the selected project, returned the tool result to Pi, streamed the final answer, and persisted the complete turn.", "pass", "Pi's internal OpenAI call now receives a random process-local credential instead of the rejected fitz-local dummy key. The host accepts it only on /v1/chat/completions, so required device authentication remains intact everywhere else and authenticated desktop chats no longer fail with 401.", "pass", "A live required-auth desktop probe crossed the previous 401 boundary, cold-loaded Qwen 3.6 35B, and returned the exact FITZ_AUTH_OK response after 2m17s.", "pass", "The complete desktop run lifecycle is isolated behind AgentRunController with event-sequence ownership and tested queue, stream, tool, approval, completion, failure, reconnect, cancellation, and control-refresh callbacks."], scope: "Submit a Pi coding-agent run and display incremental assistant output.", tests: ["Submit a normal coding task with the engine unloaded.", "Confirm the recipe name and elapsed cold-start time update inside the conversation.", "Confirm tool execution status appears before incremental output.", "Send a second prompt and confirm the resident model responds without another cold start.", "Confirm the final transcript survives task switching.", "Run with FITZ_AUTH_MODE required and confirm Pi reaches the selected route without a device-token 401."] },
        { id: "run-stop", label: "Run cancellation", availability: "ready", automated: ["pass", "Stop produced cancelled state, preserved partial output, and allowed a successful next prompt."], scope: "Stop an active generation without corrupting the task.", tests: ["Start a response long enough to cancel.", "Use the stop control.", "Confirm the status becomes cancelled.", "Send another prompt afterward."] },
        { id: "model-select", label: "Model selection", availability: "ready", automatedAt: "2026-08-02", automated: ["pass", "The model menu is anchored directly above its composer control and flips nested menus away from the viewport edge.", "pass", "Effort is reduced to Light, Medium, and High. It controls the real max_tokens output budget sent to Pi at 2,048, 8,192, and 16,384 tokens; the redundant Speed row and higher tiers are removed.", "pass", "Advanced expands inline to a persisted 0.0–2.0 Temperature control and sends that value to Pi.", "pass", "The model panel, route list, effort submenu, Advanced panel, access menu, and context popover now share compact Codex density.", "pass", "The composer always exposes only Default, Fast, and Smart. Each task persists its selected connection plus one of those stable route names, so provider model IDs never leak into normal chat."], scope: "Choose an allowed stable route, output effort budget, and advanced sampling temperature for subsequent turns.", tests: ["Open the model settings popover and confirm it sits directly above the model control.", "Confirm Model contains only Default, Fast, and Smart.", "Open the Model and Effort submenus and confirm they stay on-screen.", "Expand Advanced, move Temperature, close and reopen it, and confirm the value persists.", "Switch between available routes.", "Choose Light, Medium, and High and confirm the selected output budget is used.", "Check that the composer and Environment panel reflect the selection."] },

      try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch {}

      const tabs = document.getElementById("tabs");
      const panels = document.getElementById("panels");

      for (const section of sections) {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.id = `tab-${section.id}`;
        tab.role = "tab";
        tab.textContent = section.label;
        tab.setAttribute("aria-controls", `panel-${section.id}`);
        tab.addEventListener("click", () => activate(section.id));
        tabs.append(tab);

        const panel = document.createElement("section");
        panel.id = `panel-${section.id}`;
        panel.role = "tabpanel";
        panel.setAttribute("aria-labelledby", tab.id);
        const title = document.createElement("h2"); title.textContent = section.label;
        const badge = document.createElement("span"); badge.className = `availability ${section.availability}`; badge.textContent = availabilityText(section.availability);
        const scope = document.createElement("p"); scope.className = "scope"; scope.textContent = section.scope;
        panel.append(title, badge, scope);

        if (section.automated) {
          const automated = document.createElement("p"); automated.className = `automated ${section.automated[0]}`;
          automated.textContent = `Automated check · ${section.automatedAt || "2026-08-01"} · ${section.automated[1]}`;
          panel.append(automated);
        }

        if (section.id === "overview") renderOverview(panel);
        else renderReview(section, panel);
        panels.append(panel);
      }

      function renderOverview(panel) {
        const legend = document.createElement("div"); legend.className = "legend";
        legend.innerHTML = '<div><span class="availability ready">UI ready</span> Test it now.</div><div><span class="availability partial">Partial</span> Some backend or UI exists, but the flow is incomplete.</div><div><span class="availability missing">Missing</span> This refinement loop should design and build it.</div>';
        const heading = document.createElement("h3"); heading.textContent = "Suggested order";
        const list = document.createElement("ol"); list.className = "overview-list";
        for (const section of sections.slice(1)) { const item = document.createElement("li"); item.textContent = section.label; list.append(item); }
        panel.append(legend, heading, list);
      }

      function renderReview(section, panel) {
        const heading = document.createElement("h3"); heading.textContent = "Test checklist";
        const list = document.createElement("ul");
        section.tests.forEach((text, index) => {
          const item = document.createElement("li");
          const label = document.createElement("label"); label.className = "test";
          const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.checked = Boolean(saved[section.id]?.checks?.[index]);
          checkbox.addEventListener("change", () => { record(section.id).checks[index] = checkbox.checked; persist(); });
          const words = document.createElement("span"); words.textContent = text;
          label.append(checkbox, words); item.append(label); list.append(item);
        });
        const review = document.createElement("div"); review.className = "review";
        const verdictLabel = document.createElement("label"); verdictLabel.textContent = "Verdict";
        const verdict = document.createElement("select");
        for (const value of ["Untested", "Testing", "Pass", "Needs work", "Blocked"]) verdict.add(new Option(value, value));
        verdict.value = saved[section.id]?.verdict || "Untested";
        verdict.addEventListener("change", () => { record(section.id).verdict = verdict.value; persist(); });
        verdictLabel.append(verdict);
        const feedbackLabel = document.createElement("label"); feedbackLabel.textContent = "Feedback";
        const feedback = document.createElement("textarea"); feedback.placeholder = "What sucks? What did you expect instead?"; feedback.value = saved[section.id]?.feedback || "";
        const savedText = document.createElement("div"); savedText.className = "saved";
        feedback.addEventListener("input", () => { record(section.id).feedback = feedback.value; persist(); savedText.textContent = "Saved locally"; setTimeout(() => { savedText.textContent = ""; }, 900); });
        feedbackLabel.append(feedback);
        review.append(verdictLabel, feedbackLabel, savedText);
        panel.append(heading, list, review);
      }

      function availabilityText(value) { return value === "ready" ? "UI ready" : value === "partial" ? "Partial" : "Missing"; }
      function record(id) { saved[id] ||= { checks: [], verdict: "Untested", feedback: "" }; saved[id].checks ||= []; return saved[id]; }
      function persist() { try { localStorage.setItem(storageKey, JSON.stringify(saved)); } catch {} updateProgress(); }
      function updateProgress() { const reviewed = sections.slice(1).filter(section => saved[section.id]?.verdict && saved[section.id].verdict !== "Untested").length; document.getElementById("progress").textContent = `${reviewed} of ${sections.length - 1} reviewed`; }
      function activate(id) {
        for (const tab of tabs.children) { const active = tab.id === `tab-${id}`; tab.setAttribute("aria-selected", String(active)); tab.tabIndex = active ? 0 : -1; }
        for (const panel of panels.children) panel.hidden = panel.id !== `panel-${id}`;
        history.replaceState(null, "", `#${id}`);
      }

      activate(sections.some(section => section.id === location.hash.slice(1)) ? location.hash.slice(1) : "overview");
      updateProgress();
    </script>
  </body>
</html>
