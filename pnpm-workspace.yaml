packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

# Injected workspace packages are physical snapshots when peer dependency graphs
# prevent pnpm from deduplicating them to symlinks. Keep those snapshots aligned
# with TypeScript output whenever a workspace package is built.
syncInjectedDepsAfterScripts:
  - build

# Keep vulnerable transitive production ranges on their patched, API-compatible
# release lines without forcing unrelated framework or agent upgrades.
overrides:
  'undici@>=8.0.0 <8.9.0': 8.9.0
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'fast-uri@>=4.0.0 <4.1.2': 4.1.2
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1

onlyBuiltDependencies:
  - esbuild
  - '@google/genai'
  - protobufjs
allowBuilds:
  '@google/genai': true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  # Attachment extraction deliberately disables OCR; do not run Tesseract's
  # optional install hook in production packaging.
  tesseract.js: false
minimumReleaseAgeExclude:
  - officeparser@7.6.2
