<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src data:">
    <title>Fitz Codex</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="brand-row drag-region">
          <button id="sidebar-menu" class="icon-button no-drag" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"></rect><path d="M7 4v12"></path></svg>
          </button>
          <strong>Fitz</strong>
          <span class="brand-chevron">⌄</span>
        </div>

        <button id="new-session" class="nav-action" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15.5 5 12l8.8-8.8a1.4 1.4 0 0 1 2 2L7 14l-3 .5Z"></path><path d="m12.7 4.3 3 3"></path></svg>
          <span>New task</span>
          <kbd>Ctrl N</kbd>
        </button>

        <div class="sidebar-section">
          <div class="section-heading">
            <span>Projects</span>
            <button id="new-project" class="icon-button" type="button" title="New project" aria-label="New project">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
            </button>
          </div>
          <nav id="projects" class="project-tree" aria-label="Projects and tasks"></nav>
        </div>

        <div class="sidebar-spacer"></div>
        <button id="connection-status" class="connection-card" type="button" aria-label="Reconnect to host">
          <span class="connection-dot"></span>
          <span><strong>Local host</strong><small id="connection-detail">Connecting…</small></span>
        </button>
      </aside>

      <main class="workspace">
        <header class="workspace-header drag-region">
          <div class="workspace-title">
            <button id="sidebar-restore" class="icon-button sidebar-restore no-drag" type="button" title="Show sidebar" aria-label="Show sidebar">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"></rect><path d="M7 4v12"></path></svg>
            </button>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6.5h5l1.5 2h6.5v7.5h-13z"></path><path d="M3.5 6.5V4h5l1.5 2"></path></svg>
            <strong id="project-title">Fitz Codex</strong>
            <span id="task-title"></span>
            <button id="task-menu-toggle" class="icon-button task-menu-toggle no-drag" type="button" title="Task actions" aria-label="Task actions" aria-expanded="false" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="5" cy="10" r="1"></circle><circle cx="10" cy="10" r="1"></circle><circle cx="15" cy="10" r="1"></circle></svg>
            </button>
            <div id="task-menu" class="popover task-menu no-drag" hidden>
              <button id="rename-task" type="button"><span>Rename task</span><kbd>Ctrl+Alt+R</kbd></button>
              <button id="archive-task" type="button"><span>Archive task</span><kbd>Ctrl+Shift+A</kbd></button>
            </div>
          </div>
          <div class="header-actions no-drag">
            <button id="update" class="quiet-button" type="button" hidden>Restart to update</button>
            <button id="context-toggle" class="icon-button" type="button" title="Toggle environment panel" aria-label="Toggle environment panel" aria-expanded="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"></path><circle cx="7" cy="5" r="1"></circle><circle cx="13" cy="10" r="1"></circle><circle cx="9" cy="15" r="1"></circle></svg>
            </button>
          </div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <div class="composer-dock">
          <form id="composer" class="composer-card">
            <div id="composer-attachments" class="composer-attachments" hidden></div>
            <textarea id="prompt" rows="1" placeholder="Ask Fitz to build, debug, or explain…" aria-label="Message" disabled></textarea>
            <div class="composer-toolbar">
              <div class="composer-tools">
                <button id="attach" class="icon-button" type="button" title="Attach a file" aria-label="Attach a file" disabled>
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.2 10.8 4.9-4.9a2.1 2.1 0 0 1 3 3l-6.2 6.2a3.5 3.5 0 0 1-5-5l6-6"></path></svg>
                </button>
                <span class="mode-pill"><span class="mode-dot"></span> Local workspace</span>
              </div>
              <div class="composer-controls">
                <div class="model-picker">
                  <button id="model-toggle" class="model-toggle" type="button" aria-label="Model settings" aria-expanded="false" disabled><span id="model-summary">Model</span><span>⌄</span></button>
                  <div id="model-menu" class="popover model-menu" hidden>
                    <label><span>Model</span><select id="model" aria-label="Model route" disabled></select></label>
                    <label><span>Effort</span><select id="effort" aria-label="Effort"><option value="1024">Low</option><option value="4096" selected>Medium</option><option value="8192">High</option></select></label>
                    <label><span>Speed</span><select id="speed" aria-label="Speed"><option value="standard">Standard</option><option value="fast">Fast</option></select></label>
                  </div>
                </div>
                <span id="status" class="run-status" data-state="loading">Connecting</span>
                <button id="send" class="send-button" type="submit" title="Send message" aria-label="Send message" disabled>
                  <svg class="send-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M6 9l4-4 4 4"></path></svg>
                  <svg class="stop-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1"></rect></svg>
                </button>
              </div>
            </div>
          </form>
          <p class="composer-hint">Enter to send · Shift+Enter for a new line</p>
        </div>
      </main>

      <aside id="context-panel" class="context-panel" aria-label="Environment panel" hidden>
        <header>
          <strong>Environment</strong>
          <button id="context-close" class="icon-button" type="button" title="Close panel" aria-label="Close environment panel">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"></path></svg>
          </button>
        </header>
        <section class="environment-list">
          <div class="environment-row"><span>Engine</span><strong id="engine-state">Unknown</strong></div>
          <div class="environment-row"><span>Connection</span><strong>Local</strong></div>
          <div class="environment-row"><span>Route</span><strong id="route-state">—</strong></div>
        </section>
        <section class="panel-section">
          <div class="section-heading">
            <span>Artifacts</span>
            <button id="add-artifact" class="icon-button" type="button" title="Attach artifact" aria-label="Attach artifact" disabled>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.2 10.8 4.9-4.9a2.1 2.1 0 0 1 3 3l-6.2 6.2a3.5 3.5 0 0 1-5-5l6-6"></path></svg>
            </button>
          </div>
          <nav id="artifacts" class="artifact-list" aria-label="Artifacts"></nav>
          <div id="artifact-preview" class="artifact-preview"></div>
        </section>
      </aside>
    </div>

    <input id="artifact-file" type="file" hidden>

    <dialog id="project-dialog" class="modal">
      <form id="project-form">
        <div class="modal-heading"><div><h2>Create project</h2></div><button class="icon-button" type="button" data-close-dialog="project-dialog" aria-label="Close"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"></path></svg></button></div>
        <label class="project-name-field"><span class="input-icon"><svg viewBox="0 0 20 20"><path d="M3.5 6.5h5l1.5 2h6.5v7.5h-13z"></path></svg></span><input id="project-name" name="name" autocomplete="off" placeholder="Project name" required maxlength="80"></label>
        <label>Source folder</label>
        <button id="choose-project-folder" class="folder-picker" type="button"><svg viewBox="0 0 20 20"><path d="M3.5 6.5h5l1.5 2h6.5v7.5h-13z"></path><path d="M13 12h5M15.5 9.5v5"></path></svg><span id="project-folder-label">Add a folder Fitz can read and edit</span></button>
        <input id="project-root-path" name="rootPath" type="hidden">
        <div class="modal-actions"><button class="quiet-button" type="button" data-close-dialog="project-dialog">Cancel</button><button class="primary-button" type="submit">Create project</button></div>
      </form>
    </dialog>

    <dialog id="task-dialog" class="modal">
      <form id="task-form">
        <div class="modal-heading"><div><small>New conversation</small><h2>Start a task</h2></div><button class="icon-button" type="button" data-close-dialog="task-dialog" aria-label="Close"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"></path></svg></button></div>
        <label>Project<select id="task-project" name="project" required></select></label>
        <label>Task title<input id="task-name" name="title" autocomplete="off" placeholder="What are you working on?" required maxlength="120"></label>
        <div class="modal-actions"><button class="quiet-button" type="button" data-close-dialog="task-dialog">Cancel</button><button class="primary-button" type="submit">Create task</button></div>
      </form>
    </dialog>

    <dialog id="rename-dialog" class="modal compact-modal">
      <form id="rename-form">
        <div class="modal-heading"><div><h2>Rename task</h2></div><button class="icon-button" type="button" data-close-dialog="rename-dialog" aria-label="Close"><svg viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"></path></svg></button></div>
        <label>Task title<input id="rename-task-name" autocomplete="off" required maxlength="120"></label>
        <div class="modal-actions"><button class="quiet-button" type="button" data-close-dialog="rename-dialog">Cancel</button><button class="primary-button" type="submit">Rename</button></div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="../renderer.js"></script>
  </body>
</html>
