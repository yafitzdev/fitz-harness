<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample HTML File</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; color: #222; }
    h1 { color: #7c3aed; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .card h2 { margin-top: 0; }
    .badge { display: inline-block; background: #7c3aed; color: #fff; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.8rem; }
    code { background: #f4f4f5; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Sample HTML</h1>
  <p>This is a small <em>sample file</em> used to test the file inspector sidebar.</p>

  <div class="card">
    <h2>Card one <span class="badge">alpha</span></h2>
    <p>Some body text with <code>&lt;code&gt;</code> and a <a href="https://example.com">link</a>.</p>
  </div>

  <div class="card">
    <h2>Card two <span class="badge">beta</span></h2>
    <ul>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
    </ul>
  </div>

  <footer>
    <p>Generated on <time datetime="2025-01-01">2025-01-01</time>.</p>
  </footer>
</body>
</html>
